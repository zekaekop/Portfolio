{% extends 'base.html' %}
{% load static %}

{% block body %}

<div class="container text-white box mt-3">

    <h1>Report an Issue</h1>

    <p>Found a Bug? an issue on your end? Let us know.</p>

    <form action="" method="post">
        <input type="text" name="title" id="">
        <br>
        <textarea name="desc" id=""></textarea>
        <br>
        <button class="box-button text-white" type="submit">Submit</button>
    </form>

    <footer class="mt-3">
        <div class="d-flex justify-content-between">

            <div class="mt-3">
                <small>MIT - License</small>
                <small>Copyright (c) 2026 Eko</small>
            </div>

            <img class="ms-auto" style="max-width: 50px;" src="{% static '/img/brands/GitHub_Invertocat_White_Clearspace.svg'%}" alt="Github Icon">
        </div>
    </footer>

</div>
{% endblock %}
