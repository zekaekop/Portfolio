{% extends 'base.html' %}
{% load static %}

{% block body %}

<div class="container text-white box mt-3">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5 box">

            {% if login_status %}
                {{login_status}}
            {% endif %}
            
            <h1>Login Account</h1>
            
            <form action="" method="POST">
                {% csrf_token %}

                <hr>
                <input type="text" name="username" class="form-control text-white" placeholder="Username" required>
                <input type="password"  name="password" class="form-control text-white" placeholder="Password" required></input>
                <hr>
                <button class="box-button text-white" type="submit">Submit</button>
            </form>

            <div class="d-flex justify-content-between mt-3">
                <small><a href="{% url 'account:register' %}" class="text-fadded">Dont have an account?</a></small>
                <small><a href="{% url 'FAQ:answers' %}" class="text-fadded">Info?</a></small>
                <small><a href="/" class="text-fadded">Continue as guest</a></small>
            </div>
            
        </div>    
    </div>

</div>

{% include 'footer.html' %}

{% endblock %}
